<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf8" />
    <meta name="description" content="夫婦特化型 共通家計簿＆折半精算 PWA - PairPay" />
    <title>PairPay - 夫婦の割り勘＆立替精算</title>

    <!-- PWA & アイコン -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PairPay" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body class="bg-[#fbfaf8] min-h-screen text-[#2d312e] antialiased selection:bg-[#edf4ee] selection:text-[#426b42]">
    <!-- メインレイアウトコンテナ (スマホ幅最大448pxで中央揃え) -->
    <div id="app" class="max-w-md mx-auto min-h-screen bg-[#fbfaf8] flex flex-col relative pb-32">
      <!-- 起動時ローディング画面 (JSダウンロード中・初期化中の白紙化を完全防止) -->
      <div id="initial-loader" class="flex-1 flex flex-col items-center justify-center p-6 text-center select-none" style="min-height: 100vh;">
        <div class="relative flex items-center justify-center mb-4">
          <!-- パルスエフェクトの背景リング -->
          <div class="absolute w-24 h-24 rounded-3xl bg-[#e3ece4] animate-ping opacity-60 pointer-events-none" style="animation-duration: 2.2s;"></div>
          <!-- アプリアイコン -->
          <img src="./icon-192.png" alt="PairPay" class="relative w-20 h-20 rounded-2xl shadow-lg border border-[#e8e4dc] object-cover" />
        </div>
        
        <h1 class="text-2xl font-extrabold text-[#2d312e] tracking-tight font-sans mt-2">PairPay</h1>
        <p class="text-xs font-medium text-[#78716c] mt-1 mb-6">夫婦のスマート折半＆立替精算</p>

        <!-- スピナー & ステータス -->
        <div class="flex items-center gap-2.5 px-4 py-2 bg-white/80 backdrop-blur-xs rounded-full border border-[#ece7de] shadow-xs">
          <svg class="animate-spin h-4 w-4 text-[#52796f]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-xs font-semibold text-[#52796f]">データを読み込み中...</span>
        </div>
      </div>
    </div>

    <!-- トースト通知コンテナ -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2 items-center w-full max-w-xs px-4"></div>

    <!-- Service Worker 登録スクリプト -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('[PWA] Service Worker registered with scope:', reg.scope))
            .catch((err) => console.warn('[PWA] Service Worker registration failed:', err));
        });
      }
    </script>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
